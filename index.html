<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ABRdiary v.2.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --primary:#2563eb;
  --border:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Segoe UI,Arial;
  background:var(--bg);
}
.container{max-width:900px;margin:auto}
.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
  margin-bottom:20px;
}
h1{text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:#64748b;margin-bottom:16px}

.datetime-row{
  display:flex;gap:20px;margin-bottom:14px
}
.datetime-row input{
  border:none;
  background:transparent;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.datetime-row input:focus{outline:none}

textarea{
  width:100%;height:120px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}

.btn{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
}

.tag-btn{
  display:inline-block;
  background:#e5f0ff;
  color:#1d4ed8;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  margin:4px;
  cursor:pointer;
}
.tag-selected{background:#1d4ed8;color:#fff}

#diaryList{
  max-height:320px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}
.entry{
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  background:#fafafa;
  cursor:pointer;
}
.entry:hover{background:#f1f5f9}
.entry-date{font-size:12px;font-weight:600;color:#475569}
.entry-preview{font-size:13px;margin-top:6px}

/* MODAL */
#modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-box{
  background:#fff;
  max-width:500px;
  width:90%;
  border-radius:14px;
  padding:20px;
  position:relative;
}
.modal-close{
  position:absolute;
  top:10px;right:14px;
  font-size:18px;
  cursor:pointer;
  color:#94a3b8;
}
.modal-close:hover{color:#ef4444}

@media(max-width:600px){
  .datetime-row{flex-direction:row}
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<div class="container">

<div class="card">
<h1>📘 ABRdiary</h1>
<div class="subtitle">Diary Online Abdul Rahim</div>

<div class="datetime-row">
  <input type="date" id="diaryDate">
  <input type="time" id="diaryTime">
</div>

<label>Tag</label>
<div id="tagList"></div>
<div id="selectedTag"></div>

<label>Isi Diary</label>
<textarea id="diaryText"></textarea>

<button class="btn" onclick="saveDiary()">Simpan Diary</button>
</div>

<div class="card">
<h3>📚 Daftar Diary</h3>
<div id="diaryList"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div id="modalContent"></div>
    <br>
    <button class="btn" onclick="deleteCurrent()">Hapus Diary</button>
  </div>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyB8jqDndij0mLi4zMqukKWRiEt4r6rh-D0",
  databaseURL: "https://abrdiary-4c946-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=firebase.database();

/* DATE TIME AUTO */
let manualTime=false;
function updateTime(){
  if(!manualTime){
    const now=new Date();
    diaryTime.value=now.toTimeString().slice(0,5);
  }
}
setInterval(updateTime,1000);
diaryDate.valueAsDate=new Date();
diaryTime.onchange=()=>manualTime=true;

/* TAG */
function loadTags(){
  tagList.innerHTML="";
  db.ref("tags").once("value").then(s=>{
    const tags=s.val()||{};
    Object.keys(tags).forEach(t=>{
      let b=document.createElement("span");
      b.className="tag-btn";
      b.innerText=t;
      b.onclick=()=>selectedTag.innerHTML=`<span class="tag-btn tag-selected">${t}</span>`;
      tagList.appendChild(b);
    });
    let plus=document.createElement("span");
    plus.className="tag-btn";
    plus.innerText="+";
    plus.onclick=()=>{
      let t=prompt("Nama tag");
      if(t)db.ref("tags/"+t).set(true).then(loadTags);
    };
    tagList.appendChild(plus);
  });
}

/* SAVE */
function saveDiary(){
  if(!selectedTag.innerText||!diaryText.value)return alert("Lengkapi data");
  db.ref("diaries").push({
    date:diaryDate.value,
    time:diaryTime.value,
    text:diaryText.value,
    tag:selectedTag.innerText
  }).then(()=>{
    diaryText.value="";
    loadDiary();
  });
}

/* LIST */
let currentKey="";
function loadDiary(){
  diaryList.innerHTML="";
  db.ref("diaries").once("value").then(s=>{
    const d=s.val()||{};
    let arr=Object.keys(d).map(k=>({key:k,...d[k]}));
    arr.sort((a,b)=>(b.date+" "+b.time).localeCompare(a.date+" "+a.time));
    arr.forEach(x=>{
      let div=document.createElement("div");
      div.className="entry";
      div.innerHTML=`
        <div class="entry-date">${x.date} ${x.time} • ${x.tag}</div>
        <div class="entry-preview">${x.text.slice(0,60)}…</div>`;
      div.onclick=()=>openModal(x);
      diaryList.appendChild(div);
    });
  });
}

/* MODAL */
function openModal(x){
  currentKey=x.key;
  modalContent.innerHTML=`
    <b>${x.date} ${x.time}</b><br>
    <i>${x.tag}</i><hr>
    ${x.text.replace(/\n/g,"<br>")}
  `;
  modal.style.display="flex";
}
function closeModal(){modal.style.display="none"}
function deleteCurrent(){
  if(confirm("Yakin hapus diary ini?")){
    db.ref("diaries/"+currentKey).remove().then(()=>{
      closeModal();
      loadDiary();
    });
  }
}

loadTags();
loadDiary();
</script>

</body>
</html>
