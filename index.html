/* ========== SEMUA CSS SAMA PERSIS SEPERTI SEBELUMNYA ========== */
:root {
  --bg: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
  --card: #ffffff;
  --primary: #4f46e5;
  --primary-dark: #4338ca;

  --secondary: #10b981;
  --text: #1f2937;
  --text-light: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
  --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.08);
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 1000px; margin: 0 auto; }

/* Login Screen */
#loginScreen {

  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  animation: fadeIn 0.3s ease-out;
}
.login-card {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 40px 30px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: var(--shadow-hover);
}
.login-logo { font-size: 2.8rem; margin-bottom: 10px; background: linear-gradient(135deg,#4f46e5,#7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-title { font-size: 1.8rem; font-weight: 700; }
.login-subtitle { color: var(--text-light); margin-bottom: 30px; font-size: 0.95rem; }
.login-input {
  width: 100%;
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  margin-bottom: 20px;
  transition: all 0.3s;
}
.login-input:focus { outline: none; border-color: var(--primary); background: white; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(to right, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 12px rgba(79,70,229,0.3);

}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79,70,229,0.4); }
.btn i { margin-right: 8px; }
.btn-secondary { background: linear-gradient(to right, #6b7280, #4b5563); }
.btn-danger { background: linear-gradient(to right, #ef4444, #dc2626); }
.btn-small { padding: 8px 12px; font-size: 14px; width: auto; margin: 0; }
.btn-camera { background: linear-gradient(to right, #10b981, #059669); }

#app { display: none; animation: fadeIn 0.5s ease-out; }
.card {

}
.card:hover { box-shadow: var(--shadow-hover); }
.card-header { display: flex; align-items: center; margin-bottom: 24px; }
.card-icon {

.datetime-row {

#modal, #tagModal {

.modal-close {

.modal-image img { max-width: 100%; max-height: 300px; border-radius: 12px; }

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUp { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }
@keyframes shake { 0%,100%{transform:translateX(0);} 10%,30%,50%,70%,90%{transform:translateX(-5px);} 20%,40%,60%,80%{transform:translateX(5px);} }

@media (max-width: 560px) {

<script>
// =================== CLOUDINARY ===================
const CLOUD_NAME = "dmhawawik";
const UPLOAD_PRESET = "diary_unsigned";
const CLOUDINARY_FOLDER = "abrdiary";

// =================== LOGIN ===================
function checkLogin() {
  if (passwordInput.value === "1235813") {
    loginScreen.style.display = "none";
    app.style.display = "block";
    diaryText.focus();
  } else {
    passwordInput.style.animation = "shake 0.5s";
    setTimeout(() => passwordInput.style.animation = "", 500);
    passwordInput.value = "";
  }
}
passwordInput.addEventListener("keyup", e => e.key === "Enter" && checkLogin());

// =================== FIREBASE ===================
firebase.initializeApp({
  apiKey: "AIzaSyB8jqDndij0mLi4zMqukKWRiEt4r6rh-D0",
  databaseURL: "https://abrdiary-4c946-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

// =================== GLOBAL STATE ===================
let editingKey = null;
let currentImageFile = null;
let existingImageUrl = null;
let editingTagName = "";

// Camera
let cameraStream = null;
let currentFacingMode = "user";

// =================== DATE/TIME ===================
let manualDate = false, manualTime = false;
const now = new Date();
diaryDate.value = now.toISOString().slice(0,10);
diaryTime.value = now.toTimeString().slice(0,5);
setInterval(() => {
  const n = new Date();
  if (!manualDate) diaryDate.value = n.toISOString().slice(0,10);
  if (!manualTime) diaryTime.value = n.toTimeString().slice(0,5);
}, 60000);
diaryDate.onchange = () => manualDate = true;
diaryTime.onchange = () => manualTime = true;

// =================== KOMPRESI GAMBAR ===================
async function compressImage(file, targetKB = 175, maxWidth = 800) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.85;
        const tryCompress = () => {
          canvas.toBlob(blob => {
            const sizeKB = blob.size / 1024;
            if (sizeKB <= targetKB || quality <= 0.4) {
              resolve(new File([blob], file.name, { type: file.type }));
            } else {
              quality -= 0.08;
              tryCompress();
            }
          }, file.type, quality);
        };
        tryCompress();
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

// =================== UPLOAD CLOUDINARY ===================
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  formData.append('cloud_name', CLOUD_NAME);
  formData.append('folder', CLOUDINARY_FOLDER);
  const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || 'Upload gagal');
  return data.secure_url;
}

// =================== KAMERA MODAL ===================
const cameraModal = document.getElementById('cameraModal');
const cameraVideo = document.getElementById('cameraVideo');
const switchCameraBtn = document.getElementById('switchCameraBtn');
const capturePhotoBtn = document.getElementById('capturePhotoBtn');
const closeCameraModalBtn = document.getElementById('closeCameraModalBtn');

async function startCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  const constraints = { video: { facingMode: { exact: currentFacingMode } } };
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    cameraVideo.srcObject = cameraStream;
    if (currentFacingMode === 'user') cameraVideo.style.transform = 'scaleX(-1)';
    else cameraVideo.style.transform = 'scaleX(1)';
  } catch (err) {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
      cameraVideo.srcObject = cameraStream;
      cameraVideo.style.transform = 'scaleX(1)';
      currentFacingMode = 'unknown';
    } catch (e) { alert('Tidak dapat akses kamera'); }
  }
}

function switchCamera() {
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  startCamera();
}

function capturePhoto() {
  if (!cameraStream) return;
  const videoTrack = cameraStream.getVideoTracks()[0];
  const settings = videoTrack.getSettings();
  const width = settings.width || 640;
  const height = settings.height || 480;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  if (currentFacingMode === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(cameraVideo, 0, 0, width, height);
  ctx.setTransform(1,0,0,1,0,0);
  canvas.toBlob(async (blob) => {
    const file = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
    showNotification('Kompres foto...', 'info');
    try {
      const compressed = await compressImage(file, 175);
      if (compressed.size/1024 > 175) throw new Error('Terlalu besar');
      currentImageFile = compressed;
      const url = URL.createObjectURL(compressed);
      imagePreview.innerHTML = `<img src="${url}"><div class="image-info">${(compressed.size/1024).toFixed(1)} kb</div>`;
      removeImageBtn.style.display = 'inline-block';
      showNotification('Foto siap', 'success');
      closeCameraModal();
    } catch (err) { alert('Foto gagal: ' + err.message); }
  }, 'image/jpeg', 0.9);
}

function openCameraModal() { cameraModal.style.display = 'flex'; startCamera(); }
function closeCameraModal() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  cameraVideo.srcObject = null;
  cameraModal.style.display = 'none';
}
document.getElementById('cameraBtn').addEventListener('click', openCameraModal);
switchCameraBtn.addEventListener('click', switchCamera);
capturePhotoBtn.addEventListener('click', capturePhoto);
closeCameraModalBtn.addEventListener('click', closeCameraModal);

// =================== UPLOAD FILE ===================
const uploadBtn = document.getElementById('uploadBtn');
const imageInputFile = document.getElementById('imageInput');
uploadBtn.addEventListener('click', () => imageInputFile.click());
imageInputFile.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Harus gambar'); return; }
  showNotification('Kompres gambar...', 'info');
  try {
    const compressed = await compressImage(file, 175);
    if (compressed.size/1024 > 175) throw new Error('>175kb');
    currentImageFile = compressed;
    const url = URL.createObjectURL(compressed);
    imagePreview.innerHTML = `<img src="${url}"><div class="image-info">${(compressed.size/1024).toFixed(1)} kb</div>`;
    removeImageBtn.style.display = 'inline-block';
    showNotification('Gambar siap', 'success');
  } catch (err) { alert('Gagal kompres: ' + err.message); imageInputFile.value = ''; }
});

removeImageBtn.addEventListener('click', () => {
  currentImageFile = null;
  existingImageUrl = null;
  imagePreview.innerHTML = '';
  imageInputFile.value = '';
  removeImageBtn.style.display = 'none';
  showNotification('Gambar dihapus');
});

// =================== TAG MANAGEMENT (dengan dropdown) ===================
function loadTags() {
  db.ref("tags").once("value").then(snapshot => {
    const tags = snapshot.val() || {};
    renderTagSelect(tags);
    renderTagFilter(tags);
  });
}
function renderTagSelect(tags) {
  const select = document.getElementById('tagSelect');
  select.innerHTML = '<option value="">Pilih Tag</option>';
  Object.keys(tags).forEach(tag => {
    const option = document.createElement('option');
    option.value = tag;
    option.textContent = tag;
    select.appendChild(option);
  });
}
function renderTagFilter(tags) {
  filterTag.innerHTML = '<option value="">Semua Tag</option>';
  Object.keys(tags).forEach(tag => filterTag.appendChild(new Option(tag, tag)));
}
function openTagManager() {
  db.ref("tags").once("value").then(snapshot => {
    renderTagManager(snapshot.val() || {});
    tagModal.style.display = "flex";
  });
}
function closeTagModal() { tagModal.style.display = "none"; editingTagName = ""; newTagInput.value = ""; }
function renderTagManager(tags) {
  const container = document.getElementById("tagManageList");
  if (Object.keys(tags).length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-tags"></i><p>Belum ada tag</p></div>'; return; }
  container.innerHTML = "";
  Object.keys(tags).forEach(tag => {
    const div = document.createElement("div");
    div.className = "tag-manage-item";
    div.innerHTML = `<div class="tag-manage-name">${escapeHtml(tag)}</div><div class="tag-manage-actions"><button class="tag-action-btn tag-edit-btn" onclick="editTag('${escapeHtml(tag)}')">Edit</button><button class="tag-action-btn tag-delete-btn" onclick="deleteTag('${escapeHtml(tag)}')">Hapus</button></div>`;
    container.appendChild(div);
  });
}
window.editTag = (tag) => { editingTagName = tag; newTagInput.value = tag; newTagInput.focus(); };
window.addNewTag = () => {
  const newTag = newTagInput.value.trim();
  if (!newTag) return alert("Nama tag tidak boleh kosong");
  db.ref("tags").once("value").then(snapshot => {
    const tags = snapshot.val() || {};
    if (tags[newTag] && !editingTagName) return alert("Tag sudah ada!");
    if (editingTagName && editingTagName !== newTag) {
      delete tags[editingTagName];
      updateDiariesTag(editingTagName, newTag);
    }
    tags[newTag] = true;
    db.ref("tags").set(tags).then(() => {
      showNotification(editingTagName ? "Tag diubah" : "Tag ditambahkan");
      loadTags();
      closeTagModal();
    }).catch(err => alert("Gagal: " + err.message));
  });
};
window.deleteTag = (tag) => {
  if (!confirm(`Hapus tag "${tag}"?`)) return;
  db.ref("tags").once("value").then(snapshot => {
    const tags = snapshot.val() || {};
    delete tags[tag];
    db.ref("tags").set(tags).then(() => {
      removeTagFromDiaries(tag);
      loadTags();
      renderTagManager(tags);
      showNotification(`Tag "${tag}" dihapus`);
      closeTagModal();
    });
  });
};
function updateDiariesTag(oldTag, newTag) {
  db.ref("diaries").once("value").then(snapshot => {
    const diaries = snapshot.val() || {};
    const updates = {};
    Object.keys(diaries).forEach(key => { if (diaries[key].tag === oldTag) updates[`diaries/${key}/tag`] = newTag; });
    if (Object.keys(updates).length) db.ref().update(updates);
  });
}
function removeTagFromDiaries(tagName) {
  db.ref("diaries").once("value").then(snapshot => {
    const diaries = snapshot.val() || {};
    const updates = {};
    Object.keys(diaries).forEach(key => { if (diaries[key].tag === tagName) updates[`diaries/${key}/tag`] = "Tanpa Tag"; });
    if (Object.keys(updates).length) db.ref().update(updates).then(() => loadDiary());
  });
}

// =================== SAVE DIARY ===================
async function saveDiary() {
  const tagSelect = document.getElementById('tagSelect');
  const tag = tagSelect.value;
  if (!tag) return alert("Pilih tag terlebih dahulu");
  if (!diaryText.value.trim()) return alert("Isi diary tidak boleh kosong");

  const date = diaryDate.value;
  const time = diaryTime.value;
  const text = diaryText.value.trim();
  const saveBtn = document.getElementById("saveBtn");
  const originalText = saveBtn.innerHTML;
  saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
  saveBtn.disabled = true;

  try {
    let imageUrl = existingImageUrl;
    if (currentImageFile) {
      saveBtn.innerHTML = 'Upload gambar...';
      imageUrl = await uploadToCloudinary(currentImageFile);
    }
    const diaryData = { date, time, tag, text, timestamp: Date.now() };
    if (imageUrl) diaryData.imageUrl = imageUrl;
    else if (existingImageUrl === null && !currentImageFile) diaryData.imageUrl = null;

    if (editingKey) {
      await db.ref(`diaries/${editingKey}`).update(diaryData);
      showNotification("Diary diperbarui!");
    } else {
      await db.ref("diaries").push(diaryData);
      showNotification("Diary disimpan!");
    }
    resetForm();
    loadDiary();
  } catch (err) { alert("Error: " + err.message); }
  finally { saveBtn.innerHTML = originalText; saveBtn.disabled = false; }
}

function resetForm() {
  diaryText.value = "";
  document.getElementById('tagSelect').value = "";
  imagePreview.innerHTML = "";
  imageInputFile.value = "";
  removeImageBtn.style.display = "none";
  currentImageFile = null;
  existingImageUrl = null;
  editingKey = null;
  formTitle.innerText = "Tulis Diary";
  cancelEditBtn.style.display = "none";
  saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan';
  closeCameraModal();
  const n = new Date();
  if (!manualDate) diaryDate.value = n.toISOString().slice(0,10);
  if (!manualTime) diaryTime.value = n.toTimeString().slice(0,5);
}
function cancelEdit() { if (confirm("Batalkan edit?")) resetForm(); }

function editDiary(entry) {
  resetForm();
  editingKey = entry.key;
  diaryDate.value = entry.date;
  diaryTime.value = entry.time;
  diaryText.value = entry.text;
  existingImageUrl = entry.imageUrl || null;
  if (existingImageUrl) {
    imagePreview.innerHTML = `<img src="${existingImageUrl}"><div class="image-info">Gambar saat ini</div>`;
    removeImageBtn.style.display = "inline-block";
  }
  const tagSelect = document.getElementById('tagSelect');
  tagSelect.value = entry.tag;
  formTitle.innerText = "Edit Diary";
  cancelEditBtn.style.display = "inline-flex";
  saveBtn.innerHTML = '<i class="fas fa-save"></i> Update';
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// =================== LOAD DIARY LIST (tanpa thumbnail) ===================
function loadDiary() {
  const search = searchInput.value.toLowerCase().trim();
  const tagFilter = filterTag.value;
  diaryList.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';
  db.ref("diaries").once("value").then(snapshot => {
    const diaries = snapshot.val() || {};
    let entries = Object.entries(diaries).map(([k,v]) => ({ key:k, ...v }));
    entries.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    entries = entries.filter(e => (!search || (e.text+e.tag).toLowerCase().includes(search)) && (!tagFilter || e.tag === tagFilter));
    if (!entries.length) { diaryList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>Tidak ditemukan</h3></div>'; return; }
    diaryList.innerHTML = "";
    entries.forEach(entry => {
      const div = document.createElement("div");
      div.className = "diary-entry";
      const formattedDate = formatDate(entry.date) + " " + entry.time;
      div.innerHTML = `
        <div class="entry-header">
          <div class="entry-date">${formattedDate}</div>
          <div class="entry-tag">${escapeHtml(entry.tag)}</div>
        </div>
        <div class="entry-preview">${escapeHtml(entry.text)}</div>
      `;
      div.onclick = () => openDiaryModal(entry);
      diaryList.appendChild(div);
    });
  });
}

let currentKey = "";
function openDiaryModal(entry) {
  currentKey = entry.key;
  modalDate.innerText = formatDate(entry.date) + " • " + entry.time;
  modalTag.innerText = entry.tag;
  modalContent.innerText = entry.text;
  const imgContainer = document.getElementById("modalImageContainer");
  const modalImg = document.getElementById("modalImage");
  if (entry.imageUrl) {
    modalImg.src = entry.imageUrl;
    imgContainer.style.display = "block";
  } else imgContainer.style.display = "none";
  modal.style.display = "flex";
}
function closeModal() { modal.style.display = "none"; }
function editFromModal() {
  const entry = { key: currentKey, date: modalDate.innerText.split(" • ")[0], time: modalDate.innerText.split(" • ")[1], tag: modalTag.innerText, text: modalContent.innerText, imageUrl: document.getElementById("modalImage").src };
  closeModal();
  editDiary(entry);
}
function deleteCurrent() {
  if (!confirm("Hapus diary ini?")) return;
  db.ref("diaries/" + currentKey).remove().then(() => {
    closeModal();
    showNotification("Diary dihapus");
    loadDiary();
    if (editingKey === currentKey) resetForm();
  });
}

// =================== HELPERS ===================
function formatDate(dateStr) { return new Date(dateStr).toLocaleDateString('id-ID', { weekday:'short', year:'numeric', month:'short', day:'numeric' }); }
function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
function showNotification(msg, type='success') {
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = `position:fixed; bottom:16px; right:16px; background:${type==='success'?'#4f46e5':'#f59e0b'}; color:white; padding:8px 16px; border-radius:8px; z-index:10000; font-size:14px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// =================== EVENT LISTENERS ===================
searchInput.addEventListener("input", loadDiary);
filterTag.addEventListener("change", loadDiary);
newTagInput.addEventListener("keyup", e => e.key === "Enter" && addNewTag());

// =================== SERVICE WORKER REGISTRATION (PWA) ===================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ Service Worker registered:', reg))
      .catch(err => console.log('❌ SW registration failed:', err));
  });
}

// =================== INIT ===================
loadTags();
loadDiary();
</script>
