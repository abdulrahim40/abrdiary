<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbrDiary - Diary Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        /* Login Screen */
        .login-screen {
            padding: 50px 30px;
            text-align: center;
        }
        
        .login-box {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-box h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }
        
        .password-box {
            margin: 30px 0;
        }
        
        .password-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .login-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        
        .error-msg {
            color: #ef4444;
            margin-top: 10px;
            display: none;
        }
        
        .firebase-debug {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
        }
        
        /* Main App */
        .main-app {
            display: none;
        }
        
        .app-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 5px;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        
        .tag {
            background: #e0e7ff;
            color: #4f46e5;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .tag.active {
            background: #4f46e5;
            color: white;
        }
        
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="login-screen" id="loginScreen">
            <div class="login-box">
                <h1>📔 AbrDiary</h1>
                <p>Diary Online dengan Firebase</p>
                
                <div class="password-box">
                    <input type="password" id="password" placeholder="Password: 12354" autocomplete="off">
                    <button class="login-btn" id="loginBtn">MASUK</button>
                    <div class="error-msg" id="errorMsg">Password salah!</div>
                </div>
                
                <div class="firebase-debug" id="firebaseDebug">
                    Status Firebase: Memeriksa...
                </div>
            </div>
        </div>
        
        <div class="main-app" id="mainApp">
            <div class="app-header">
                <h2>AbrDiary</h2>
                <div id="connectionStatus">⏳ Connecting...</div>
            </div>
            
            <div class="main-content">
                <h3>Tulis Entry Baru</h3>
                
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="entryDate">
                </div>
                
                <div class="form-group">
                    <label>Tags</label>
                    <div class="tags" id="tagsContainer">
                        <!-- Tags akan muncul di sini -->
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <input type="text" id="newTag" placeholder="Tag baru">
                        <button id="addTagBtn">+</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Isi Diary</label>
                    <textarea id="entryContent" placeholder="Tulis diary Anda..."></textarea>
                </div>
                
                <button id="saveBtn">💾 Simpan ke Cloud</button>
                <button id="clearBtn">🗑️ Bersihkan</button>
                
                <hr style="margin: 20px 0;">
                
                <h3>Entries Anda</h3>
                <div id="entriesList">
                    <!-- Entries akan muncul di sini -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI
        // ============================================
        const PASSWORD = "12354";
        
        // Firebase Config - PASTIKAN INI BENAR
        const firebaseConfig = {
apiKey: "AIzaSyCQeFVP5fWgKp-8uVeS8EP8fw8mLlcpXPI",
  authDomain: "abrdiary-fa4a0.firebaseapp.com",
  databaseURL: "https://abrdiary-fa4a0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "abrdiary-fa4a0",
  storageBucket: "abrdiary-fa4a0.firebasestorage.app",
  messagingSenderId: "74662498200",
  appId: "1:74662498200:web:55d6e7d7921d69ff70e5ed"
        };
        
        // ============================================
        // INISIALISASI SIMPLE
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Memulai aplikasi...");
            
            // Set tanggal hari ini
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('entryDate').value = today;
            
            // Setup event listeners
            document.getElementById('loginBtn').onclick = function() {
                const password = document.getElementById('password').value;
                if (password === PASSWORD) {
                    loginSuccess();
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            };
            
            // Coba initialize Firebase
            initializeFirebase();
        });
        
        function initializeFirebase() {
            console.log("Menginisialisasi Firebase...");
            updateDebug("Menginisialisasi Firebase...");
            
            try {
                // Initialize Firebase
                const app = firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();
                const db = firebase.database();
                
                console.log("Firebase app initialized:", app.name);
                updateDebug("✅ Firebase app initialized");
                
                // Coba koneksi database
                const connectedRef = db.ref(".info/connected");
                connectedRef.on("value", function(snap) {
                    if (snap.val() === true) {
                        console.log("✅ Firebase Database connected");
                        updateDebug("✅ Firebase Database connected");
                        document.getElementById('connectionStatus').textContent = "✅ Connected";
                        document.getElementById('connectionStatus').style.color = "#10b981";
                        
                        // Coba login anonymous
                        auth.signInAnonymously()
                            .then(function(userCredential) {
                                console.log("✅ Anonymous login successful:", userCredential.user.uid);
                                updateDebug("✅ Anonymous login successful");
                            })
                            .catch(function(error) {
                                console.error("Anonymous login error:", error);
                                updateDebug("❌ Login error: " + error.code);
                            });
                    } else {
                        console.log("❌ Firebase Database disconnected");
                        updateDebug("❌ Firebase Database disconnected");
                        document.getElementById('connectionStatus').textContent = "❌ Disconnected";
                        document.getElementById('connectionStatus').style.color = "#ef4444";
                    }
                });
                
                // Test write ke database
                setTimeout(() => {
                    testDatabaseWrite(db, auth);
                }, 2000);
                
            } catch (error) {
                console.error("Firebase initialization error:", error);
                updateDebug("❌ Error: " + error.message);
            }
        }
        
        function testDatabaseWrite(db, auth) {
            const userId = auth.currentUser ? auth.currentUser.uid : 'test-user';
            
            db.ref('test/' + userId).set({
                test: true,
                timestamp: new Date().toISOString()
            }).then(() => {
                console.log("✅ Test write successful");
                updateDebug("✅ Test write successful");
            }).catch((error) => {
                console.error("Test write error:", error);
                updateDebug("❌ Write error: " + error.code);
            });
        }
        
        function updateDebug(message) {
            document.getElementById('firebaseDebug').innerHTML = 
                "<strong>Debug Info:</strong> " + message;
        }
        
        function loginSuccess() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // Setup tags
            displayTags(['Pribadi', 'Kerja', 'Hobi']);
            
            // Setup event listeners untuk app
            setupAppListeners();
        }
        
        function displayTags(tags) {
            const container = document.getElementById('tagsContainer');
            container.innerHTML = '';
            
            tags.forEach(tag => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag';
                tagEl.textContent = tag;
                tagEl.onclick = function() {
                    this.classList.toggle('active');
                };
                container.appendChild(tagEl);
            });
        }
        
        function setupAppListeners() {
            // Simple save function (tanpa Firebase dulu)
            document.getElementById('saveBtn').onclick = function() {
                const date = document.getElementById('entryDate').value;
                const content = document.getElementById('entryContent').value;
                
                if (!content) {
                    alert("Harap tulis isi diary!");
                    return;
                }
                
                // Get selected tags
                const selectedTags = [];
                document.querySelectorAll('.tag.active').forEach(tag => {
                    selectedTags.push(tag.textContent);
                });
                
                // Create entry
                const entry = {
                    id: Date.now(),
                    date: date,
                    tags: selectedTags,
                    content: content,
                    created: new Date().toISOString()
                };
                
                // Save to localStorage (temporary)
                let entries = JSON.parse(localStorage.getItem('abrdiary_entries') || '[]');
                entries.push(entry);
                localStorage.setItem('abrdiary_entries', JSON.stringify(entries));
                
                // Display entry
                displayEntries(entries);
                
                // Clear form
                document.getElementById('entryContent').value = '';
                document.querySelectorAll('.tag.active').forEach(tag => {
                    tag.classList.remove('active');
                });
                
                alert("Entry disimpan (sementara di localStorage)");
            };
            
            // Clear form
            document.getElementById('clearBtn').onclick = function() {
                document.getElementById('entryContent').value = '';
                document.querySelectorAll('.tag.active').forEach(tag => {
                    tag.classList.remove('active');
                });
            };
            
            // Add tag
            document.getElementById('addTagBtn').onclick = function() {
                const newTag = document.getElementById('newTag').value.trim();
                if (newTag) {
                    // Add to tags display
                    const container = document.getElementById('tagsContainer');
                    const tagEl = document.createElement('div');
                    tagEl.className = 'tag';
                    tagEl.textContent = newTag;
                    tagEl.onclick = function() {
                        this.classList.toggle('active');
                    };
                    container.appendChild(tagEl);
                    
                    document.getElementById('newTag').value = '';
                }
            };
            
            // Load existing entries
            const entries = JSON.parse(localStorage.getItem('abrdiary_entries') || '[]');
            displayEntries(entries);
        }
        
        function displayEntries(entries) {
            const container = document.getElementById('entriesList');
            
            if (entries.length === 0) {
                container.innerHTML = '<p style="color: #666;">Belum ada entries.</p>';
                return;
            }
            
            // Sort by date (newest first)
            entries.sort((a, b) => b.id - a.id);
            
            container.innerHTML = entries.map(entry => `
                <div style="background: #f9fafb; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #4f46e5;">
                    <div style="color: #4f46e5; font-weight: bold; margin-bottom: 5px;">
                        ${new Date(entry.date).toLocaleDateString('id-ID')}
                    </div>
                    ${entry.tags.length > 0 ? `
                        <div style="margin: 5px 0;">
                            ${entry.tags.map(tag => `<span style="background: #e0e7ff; color: #4f46e5; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 5px;">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div style="margin: 10px 0;">
                        ${entry.content}
                    </div>
                    <div style="font-size: 12px; color: #888;">
                        ${new Date(entry.created).toLocaleString('id-ID')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
